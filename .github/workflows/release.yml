name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build a snapshot (no tag required, nothing published)
  # so the pipeline can be smoke-tested from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Gate the release on the full CI check: a green tag should never
      # publish broken binaries. `make check` = gofmt + go vet + race-
      # clean unit tests across every package.
      - name: Check
        run: make check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pin to the v2 line. Locks the workflow against an
          # unintended v3 jump (which has historically been the source
          # of breaking config changes in GoReleaser) while still
          # picking up v2.x bug fixes.
          version: "~> v2"
          # Tag pushes publish; workflow_dispatch builds a snapshot
          # (release --clean fails without a tag).
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
