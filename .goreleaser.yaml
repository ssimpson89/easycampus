version: 2

project_name: easycampus

before:
  hooks:
    - go mod download

builds:
  - id: easycampus
    main: ./cmd/easycampus
    binary: easycampus
    env:
      - CGO_ENABLED=0
    # Strip local filesystem paths from the binary and pin its mtime to
    # the commit timestamp (steps toward reproducible archives).
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Windows is not released yet: the decoder's mpv control uses a
    # unix socket, and mpv on Windows only speaks named pipes, so
    # projector output can't work there. The encoder does build and run
    # on Windows from source (GOOS=windows go build ./cmd/easycampus).
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X easycampus/internal/version.Version={{ .Version }}
        -X easycampus/internal/version.Commit={{ .Commit }}
        -X easycampus/internal/version.Date={{ .Date }}

archives:
  - id: easycampus
    ids:
      - easycampus
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
